name: Security audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Code Scanning
  actions: read
  pull-requests: write     # for PR summary comments

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/javascript \
            --config p/nodejs \
            --config p/docker \
            --sarif --output semgrep.sarif \
            --metrics off \
            --error || true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  osv-scanner:
    name: OSV (dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv.sarif
            ./
        continue-on-error: true

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-sarif
          path: osv.sarif

  summary:
    name: Aggregate report
    needs: [semgrep, osv-scanner]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          path: sarif

      - name: Build markdown summary
        shell: bash
        run: |
          set -euo pipefail
          report="security-summary.md"
          {
            echo "# Security Audit Summary"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo "**Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "| Scanner | Critical | High | Medium | Low |"
            echo "|---------|---------:|-----:|-------:|----:|"
            for f in sarif/*/*.sarif; do
              name=$(basename "$(dirname "$f")")
              # Severity from SARIF: result.level (error|warning|note) + properties.security-severity (CVSS)
              counts=$(jq -r '
                [.runs[].results[]?
                  | (.properties["security-severity"] // "0") | tonumber] as $s
                | {
                    crit: ($s | map(select(. >= 9))   | length),
                    high: ($s | map(select(. >= 7 and . < 9)) | length),
                    med:  ($s | map(select(. >= 4 and . < 7)) | length),
                    low:  ($s | map(select(. >  0 and . < 4)) | length)
                  } | "\(.crit)|\(.high)|\(.med)|\(.low)"' "$f" 2>/dev/null || echo "0|0|0|0")
              echo "| ${name} | ${counts//|/ | } |"
            done
            echo
            echo "Full findings are in the **Security → Code scanning alerts** tab."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
